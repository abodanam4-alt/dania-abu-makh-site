<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حجر ورقة مقص: معركة الأقفال | موقع الأستاذة دانية أبو مخ</title>
<style>
:root{--gold:#f2c14e;--gold2:#ffe9a6;--gold3:#a8691a;--ink:#1c1230;--panel:#1a1436;--red:#b3202d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05030c;overflow:hidden;font-family:"Segoe UI",Tahoma,Arial,sans-serif;-webkit-user-select:none;user-select:none}
#wrap{position:fixed;inset:0;background:#05030c}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;background:#07051a}
#cam{position:absolute;inset:0;perspective:1400px;perspective-origin:50% 45%}
#world{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 2.2s cubic-bezier(.45,0,.2,1)}
.layer{position:absolute;inset:0}
.bg{transform:translateZ(-600px) scale(1.43);
  background:
   radial-gradient(ellipse 40% 30% at 50% 30%, rgba(120,90,255,.35), transparent 70%),
   radial-gradient(ellipse 30% 40% at 15% 20%, rgba(255,170,60,.18), transparent 70%),
   radial-gradient(ellipse 30% 40% at 85% 20%, rgba(255,170,60,.18), transparent 70%),
   radial-gradient(ellipse 80% 60% at 50% 110%, rgba(150,40,160,.45), transparent 70%),
   linear-gradient(#0b0a2a,#140a2e 55%,#1d0b28)}
.bg svg{position:absolute;inset:0;width:100%;height:100%}
.mid{transform:translateZ(-260px) scale(1.19);pointer-events:none}
.floor{transform:translateZ(-80px) scale(1.06);pointer-events:none}
.beam{position:absolute;top:-40px;width:300px;height:1000px;margin-left:-150px;transform-origin:50% 0;mix-blend-mode:screen;filter:blur(5px);
  background:linear-gradient(rgba(255,236,180,.55),rgba(255,210,120,.08) 70%,transparent);clip-path:polygon(46% 0,54% 0,100% 100%,0 100%);animation:swing 7s ease-in-out infinite alternate}
.beam.b{background:linear-gradient(rgba(140,180,255,.5),rgba(120,140,255,.06) 70%,transparent)}
@keyframes swing{from{transform:rotate(var(--a1))}to{transform:rotate(var(--a2))}}
.lamp{position:absolute;top:-14px;width:60px;height:40px;margin-left:-30px;border-radius:0 0 30px 30px;background:radial-gradient(circle at 50% 80%,#fff8dc,#ffcf6a 40%,#3a2a1a 70%);box-shadow:0 0 40px 10px rgba(255,220,140,.6)}
.banner{position:absolute;top:60px;width:110px;height:300px}
#dust,#fx{position:absolute;inset:0;pointer-events:none}
#fx{z-index:400}
.ui{position:absolute;inset:0;transform:translateZ(0)}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:block;animation:scrIn .8s cubic-bezier(.2,1,.3,1)}
@keyframes scrIn{from{opacity:0;filter:blur(14px);transform:scale(1.08)}}
.vig{position:absolute;inset:0;pointer-events:none;z-index:300;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.7) 100%)}
#flash{position:absolute;inset:0;pointer-events:none;z-index:350;opacity:0;background:#fff}
#siren{position:absolute;inset:0;pointer-events:none;z-index:340;opacity:0}
#siren.on{animation:siren .5s linear infinite}
@keyframes siren{0%,100%{opacity:.55;background:radial-gradient(circle at 15% 10%,rgba(255,30,30,.9),transparent 50%),rgba(120,0,0,.35)}50%{opacity:.55;background:radial-gradient(circle at 85% 10%,rgba(40,80,255,.9),transparent 50%),rgba(0,0,90,.3)}}
.shake{animation:shk .5s linear}
.shake-long{animation:shk .35s linear infinite}
@keyframes shk{0%,100%{transform:translate(0,0)}15%{transform:translate(-12px,6px) rotate(-.6deg)}30%{transform:translate(10px,-8px) rotate(.5deg)}45%{transform:translate(-8px,-5px)}60%{transform:translate(9px,7px) rotate(.4deg)}80%{transform:translate(-5px,3px)}}

/* ---------- metal / gold UI ---------- */
.plate{position:absolute;left:50%;transform:translateX(-50%);padding:10px 46px;border-radius:22px;white-space:nowrap;
  background:linear-gradient(#2c2550,#151030);box-shadow:inset 0 2px 0 rgba(255,255,255,.25),inset 0 -4px 10px rgba(0,0,0,.6),0 0 0 4px #c8933a,0 0 0 7px #4a2f10,0 0 0 9px #e8b85a,0 18px 40px rgba(0,0,0,.7)}
.gt{background:linear-gradient(#fff8d8 0%,#ffd970 35%,#e3a12e 60%,#fff0b0 75%,#b8741c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #5a3008) drop-shadow(0 6px 10px rgba(0,0,0,.6))}
.btn{font:900 30px "Segoe UI",Tahoma,Arial;border:0;cursor:pointer;color:#2a1504;padding:16px 46px;border-radius:40px;position:relative;
  background:linear-gradient(#fff3c2,#f6c851 45%,#d68f1e);box-shadow:inset 0 2px 0 #fff,inset 0 -5px 0 rgba(120,60,0,.5),0 0 0 3px #7a4510,0 0 30px rgba(255,200,80,.55),0 10px 22px rgba(0,0,0,.6);transition:transform .15s,box-shadow .2s}
.btn:hover{transform:translateY(-3px) scale(1.04);box-shadow:inset 0 2px 0 #fff,inset 0 -5px 0 rgba(120,60,0,.5),0 0 0 3px #7a4510,0 0 50px rgba(255,210,90,.9),0 14px 26px rgba(0,0,0,.6)}
.btn:active{transform:scale(.97)}
.btn.blue{color:#fff;background:linear-gradient(#8fd0ff,#3a7ae0 50%,#1e3f9a);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),inset 0 -5px 0 rgba(0,0,60,.5),0 0 0 3px #142a66,0 0 26px rgba(90,160,255,.6),0 10px 22px rgba(0,0,0,.6)}
.btn.ghost{color:#ffe9a6;background:linear-gradient(#3a2f6a,#1d1640);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 0 2px #c8933a,0 8px 18px rgba(0,0,0,.5)}
.btn.sel{box-shadow:inset 0 2px 0 #fff,0 0 0 4px #fff,0 0 40px rgba(255,220,120,1)}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:inset 0 2px 0 #fff,inset 0 -5px 0 rgba(120,60,0,.5),0 0 0 3px #7a4510,0 0 70px rgba(255,210,90,1),0 10px 22px rgba(0,0,0,.6)}}
.tools{position:absolute;left:20px;top:18px;display:flex;gap:10px;z-index:320}
.tb{width:54px;height:54px;border-radius:16px;border:0;cursor:pointer;color:#ffe9a6;display:grid;place-items:center;font-size:24px;
  background:linear-gradient(#3a2f6a,#1a1338);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 0 2px #c8933a,0 6px 14px rgba(0,0,0,.6);transition:transform .15s}
.tb:hover{transform:translateY(-2px)}
.tb svg{width:26px;height:26px}

/* ---------- intro ---------- */
#intro .title{position:absolute;left:50%;top:70px;transform:translateX(-50%);text-align:center}
.crown{width:120px;height:80px;display:block;margin:0 auto -18px;filter:drop-shadow(0 0 20px rgba(255,200,80,.7))}
.t1{display:inline-block;white-space:nowrap;padding:14px 54px 10px;border-radius:26px;font:900 72px/1 Georgia,"Times New Roman",serif;letter-spacing:1px;direction:ltr;
  background:linear-gradient(#352a5e,#140f2c);box-shadow:inset 0 3px 0 rgba(255,255,255,.2),inset 0 -6px 14px rgba(0,0,0,.6),0 0 0 5px #d39b3e,0 0 0 9px #4a2f10,0 0 0 11px #f0c46a,0 0 60px rgba(255,190,80,.45),0 24px 50px rgba(0,0,0,.8)}
.t2{display:inline-block;margin-top:22px;padding:10px 44px;border-radius:20px;font:900 50px/1 Georgia,serif;letter-spacing:3px;direction:ltr;
  background:linear-gradient(#2b2350,#120d26);box-shadow:inset 0 2px 0 rgba(255,255,255,.2),0 0 0 4px #c8933a,0 0 0 7px #4a2f10,0 14px 30px rgba(0,0,0,.7)}
.laurel{position:absolute;bottom:-10px;width:110px;height:110px}
.vs{position:absolute;left:50%;top:420px;transform:translateX(-50%);font:italic 900 130px/1 Georgia,serif;direction:ltr}
.vs .gt{filter:drop-shadow(0 0 30px rgba(255,170,40,.9)) drop-shadow(0 6px 0 #6a3a08)}
.vs:before,.vs:after{content:"";position:absolute;top:50%;width:230px;height:5px;border-radius:5px;background:linear-gradient(90deg,transparent,#ffd36b,#fff);box-shadow:0 0 18px #ffb43a}
.vs:before{right:105%}.vs:after{left:105%;transform:scaleX(-1)}
.hexes{position:absolute;left:50%;top:585px;transform:translateX(-50%);display:flex;gap:34px;direction:ltr}
.hex{width:130px;height:146px;display:grid;place-items:center;font-size:66px;position:relative;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(#2a6bd8,#0e1f55);animation:hexf 3s ease-in-out infinite}
.hex:before{content:"";position:absolute;inset:6px;clip-path:inherit;background:radial-gradient(circle at 50% 40%,#1c3c8a,#0a1236)}
.hex span{position:relative;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))}
.hex:nth-child(2){animation-delay:.3s}.hex:nth-child(3){animation-delay:.6s}
@keyframes hexf{50%{transform:translateY(-12px);filter:drop-shadow(0 0 22px #5ab0ff)}}
.introAv{position:absolute;bottom:-20px;width:430px;height:516px;animation:breathe 4s ease-in-out infinite}
.introAv.l{left:30px}.introAv.r{right:30px}
@keyframes breathe{50%{transform:translateY(-10px) scale(1.01)}}
#intro .go{position:absolute;left:50%;top:790px;transform:translateX(-50%)}
#intro .go .btn{font-size:36px;padding:18px 70px}
.sub{position:absolute;left:50%;top:752px;transform:translateX(-50%);color:#d9ccff;font-size:22px;font-weight:700;opacity:.9;white-space:nowrap}

/* ---------- setup ---------- */
.panelBox{position:absolute;left:50%;transform:translateX(-50%);border-radius:30px;padding:30px 40px;color:#f4ecff;
  background:linear-gradient(rgba(44,34,92,.92),rgba(20,14,48,.95));box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 0 0 3px #c8933a,0 0 0 6px #3a250c,0 30px 60px rgba(0,0,0,.7)}
.row{display:flex;gap:16px;justify-content:center;align-items:center;margin:14px 0}
.lab{font-size:26px;font-weight:800;color:#ffe9a6}
.names{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.names input{font:800 26px "Segoe UI",Tahoma,Arial;padding:12px 18px;border-radius:16px;border:0;text-align:center;color:#1c1230;background:#fff8e6;box-shadow:inset 0 0 0 3px #c8933a}
/* avatar select */
.avRow{position:absolute;left:50%;top:250px;transform:translateX(-50%);display:flex;gap:14px}
.avc{width:178px;height:290px;border-radius:24px;position:relative;cursor:pointer;overflow:hidden;transition:transform .25s,box-shadow .25s,filter .3s;
  background:radial-gradient(circle at 50% 30%,#4a3a8a,#1a1238 75%);box-shadow:inset 0 0 0 3px #f2c14e,inset 0 0 30px rgba(255,200,90,.35),0 0 18px rgba(255,190,70,.45),0 14px 30px rgba(0,0,0,.6)}
.avc svg{position:absolute;left:-8px;bottom:22px;width:194px;height:233px}
.avc .nm{position:absolute;bottom:0;left:0;right:0;padding:6px;text-align:center;font-weight:900;font-size:21px;color:#2a1504;background:linear-gradient(#ffe9a6,#e0a43a)}
.avc:hover{transform:translateY(-14px) scale(1.05);box-shadow:inset 0 0 0 4px #fff3c0,inset 0 0 40px rgba(255,220,120,.5),0 0 40px rgba(255,210,90,.9),0 20px 34px rgba(0,0,0,.6)}
.avc.taken{filter:grayscale(1) brightness(.45);pointer-events:none}
.avc .owner{position:absolute;top:10px;left:50%;transform:translateX(-50%);padding:4px 14px;border-radius:14px;background:#b3202d;color:#fff;font-weight:900;font-size:17px;white-space:nowrap;box-shadow:0 0 0 2px #ffd36b}
.avc.pick{animation:pickA .7s}
@keyframes pickA{40%{transform:scale(1.18);box-shadow:0 0 0 6px #fff,0 0 80px #ffd36b}}
.whoPick{position:absolute;left:50%;top:150px;transform:translateX(-50%);font-size:34px;font-weight:900;color:#fff;text-shadow:0 0 20px rgba(160,120,255,.9)}
.whoPick b{color:#ffd36b}

/* ---------- duel ---------- */
.fighter{position:absolute;bottom:40px;width:520px;height:624px;transition:transform .7s cubic-bezier(.2,1.2,.3,1),filter .6s,opacity .6s}
.fighter.R{right:60px}.fighter.L{left:60px}
.fighter svg{width:100%;height:100%}
.fighter.R svg{transform:scaleX(-1)}
.fighter.out.R{transform:translateX(700px)}.fighter.out.L{transform:translateX(-700px)}
.fighter.lose{filter:grayscale(.85) brightness(.45);transform:scale(.88) translateY(30px)}
.fighter.win{filter:drop-shadow(0 0 40px rgba(255,210,90,.95)) brightness(1.1);transform:scale(1.06)}
.ring{position:absolute;left:50%;bottom:20px;width:420px;height:90px;margin-left:-210px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(255,210,120,.5),transparent 70%);box-shadow:0 0 0 4px rgba(255,210,120,.4),0 0 40px rgba(255,190,80,.5)}
.nameTag{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);padding:8px 26px;border-radius:18px;font-weight:900;font-size:28px;color:#fff;white-space:nowrap;
  background:linear-gradient(#3a2f7a,#191240);box-shadow:0 0 0 3px #f2c14e,0 8px 18px rgba(0,0,0,.6)}
.handHex{position:absolute;top:300px;width:200px;height:226px;display:grid;place-items:center;font-size:110px;z-index:5;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(#5ab0ff,#13307a);transition:transform .3s}
.handHex:before{content:"";position:absolute;inset:7px;clip-path:inherit;background:radial-gradient(circle at 50% 40%,#244a9c,#0a1236)}
.handHex span{position:relative;display:block}
.handHex.R{right:560px}.handHex.L{left:560px}
.handHex.bob span{animation:bob .42s ease-in-out 3}
@keyframes bob{50%{transform:translateY(-40px) rotate(-12deg)}}
.handHex.show{animation:reveal .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes reveal{0%{transform:scale(.3)}100%{transform:scale(1)}}
.handHex.won{background:linear-gradient(#ffe9a6,#d68f1e);filter:drop-shadow(0 0 30px #ffcf5a)}
.handHex.lost{filter:grayscale(1) brightness(.6)}
.hlabel{position:absolute;top:535px;width:200px;text-align:center;font-size:30px;font-weight:900;color:#fff;text-shadow:0 0 14px rgba(90,170,255,.9)}
.hlabel.R{right:560px}.hlabel.L{left:560px}
.count{position:absolute;left:50%;top:300px;transform:translate(-50%,0);font:900 230px/1 Georgia,serif;direction:ltr;pointer-events:none;z-index:20}
.count.pop{animation:cpop .9s ease-out forwards}
@keyframes cpop{0%{transform:translate(-50%,0) scale(2.4);opacity:0}25%{transform:translate(-50%,0) scale(1);opacity:1}80%{opacity:1}100%{transform:translate(-50%,0) scale(.7);opacity:0}}
.chant{position:absolute;left:50%;top:170px;transform:translateX(-50%);font-size:48px;font-weight:900;color:#fff;white-space:nowrap;text-shadow:0 0 24px rgba(150,110,255,1),0 4px 0 #2a1a5a}
.verdict{position:absolute;left:50%;top:150px;transform:translateX(-50%);text-align:center;white-space:nowrap;z-index:30}
.verdict .v1{font-size:64px;font-weight:900}
.verdict .v2{font-size:30px;font-weight:800;color:#fff;margin-top:8px;text-shadow:0 2px 8px #000}
.hitfx{position:absolute;left:50%;top:410px;width:600px;height:600px;margin:-300px 0 0 -300px;border-radius:50%;pointer-events:none;z-index:15;mix-blend-mode:screen;
  background:radial-gradient(circle,rgba(255,255,255,1) 0%,rgba(255,220,120,.8) 18%,rgba(255,140,40,.3) 40%,transparent 65%);animation:hit .7s ease-out forwards}
@keyframes hit{0%{transform:scale(.1);opacity:1}100%{transform:scale(1.6);opacity:0}}
.duelVS{position:absolute;left:50%;top:600px;transform:translateX(-50%);font:italic 900 110px/1 Georgia,serif;direction:ltr}

/* ---------- winner ---------- */
.pedestal{position:absolute;left:470px;bottom:30px;width:520px;height:130px;margin-left:-260px}
.winAv{position:absolute;left:470px;bottom:90px;width:560px;height:672px;margin-left:-280px;animation:winIn 1s cubic-bezier(.2,1.3,.3,1)}
@keyframes winIn{from{transform:translateY(300px) scale(.6);opacity:0}}
.orbit{position:absolute;left:470px;bottom:120px;width:640px;height:640px;margin-left:-320px;transform-style:preserve-3d;pointer-events:none}
.orbit i{position:absolute;inset:0;border-radius:50%;border:6px solid rgba(255,214,110,.85);box-shadow:0 0 30px rgba(255,200,80,.9),inset 0 0 30px rgba(255,200,80,.6);border-left-color:transparent;border-bottom-color:rgba(255,214,110,.15)}
.orbit i:nth-child(1){animation:orb1 2.4s linear infinite}
.orbit i:nth-child(2){inset:60px;animation:orb2 3.2s linear infinite}
.orbit i:nth-child(3){inset:-40px;border-width:3px;animation:orb3 4s linear infinite}
@keyframes orb1{from{transform:rotateX(72deg) rotateZ(0)}to{transform:rotateX(72deg) rotateZ(360deg)}}
@keyframes orb2{from{transform:rotateX(68deg) rotateY(12deg) rotateZ(360deg)}to{transform:rotateX(68deg) rotateY(12deg) rotateZ(0)}}
@keyframes orb3{from{transform:rotateX(78deg) rotateY(-10deg) rotateZ(0)}to{transform:rotateX(78deg) rotateY(-10deg) rotateZ(360deg)}}
.emblem{position:absolute;right:120px;top:90px;width:560px;text-align:center;animation:emb 1s .4s cubic-bezier(.2,1.5,.4,1) both}
@keyframes emb{from{transform:scale(0) rotate(-10deg);opacity:0}}
.emblem svg{width:560px;height:380px}
.prize{margin:6px auto 0;width:470px;padding:16px 10px 10px;border-radius:26px;background:linear-gradient(#22183e,#0d0920);box-shadow:inset 0 2px 0 rgba(255,255,255,.2),0 0 0 4px #c8933a,0 0 0 7px #3a250c,0 0 50px rgba(255,190,70,.5)}
.prize .n{font:900 110px/1 "Segoe UI",Tahoma,Arial;direction:ltr}
.prize .u{font-size:38px;font-weight:900;color:#ffe9a6}
.winName{font-size:40px;font-weight:900;color:#fff;margin-top:14px;text-shadow:0 0 20px rgba(255,200,90,.9)}
.winNext{position:absolute;right:250px;bottom:46px}

/* ---------- leaderboard ---------- */
.lb{position:absolute;left:26px;top:96px;width:370px;border-radius:26px;padding:16px 14px 14px;z-index:250;transition:transform .6s cubic-bezier(.2,1.2,.3,1),opacity .4s;
  background:linear-gradient(rgba(40,30,86,.95),rgba(16,11,40,.97));box-shadow:inset 0 2px 0 rgba(255,255,255,.15),0 0 0 3px #c8933a,0 0 0 6px #3a250c,0 20px 40px rgba(0,0,0,.7)}
.lb.hide{transform:translateX(-460px);opacity:0;pointer-events:none}
.lb h3{margin:0 0 10px;text-align:center;font-size:28px}
.lbList{position:relative}
.lbRow{position:absolute;left:0;right:0;height:72px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:18px;transition:transform .7s cubic-bezier(.3,1.3,.4,1);
  background:linear-gradient(90deg,rgba(255,255,255,.07),rgba(255,255,255,.14));box-shadow:inset 0 0 0 2px rgba(242,193,78,.55)}
.lbRow.first{background:linear-gradient(90deg,rgba(255,210,100,.18),rgba(255,210,100,.32));box-shadow:inset 0 0 0 2px #ffd36b,0 0 22px rgba(255,200,80,.5)}
.medal{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:22px;color:#2a1504;flex:none;
  background:radial-gradient(circle at 35% 30%,#fff3c0,#d6a03a);box-shadow:0 0 0 3px rgba(0,0,0,.25)}
.medal.r2{background:radial-gradient(circle at 35% 30%,#fff,#9aa3b5)}.medal.r3{background:radial-gradient(circle at 35% 30%,#ffd9b0,#b06a2e)}.medal.r4{background:radial-gradient(circle at 35% 30%,#bcd7ff,#3a62b8);color:#fff}
.lbAv{width:58px;height:58px;border-radius:14px;overflow:hidden;flex:none;background:radial-gradient(circle,#5a4aa8,#20184a);box-shadow:0 0 0 2px #f2c14e}
.lbAv svg{width:80px;height:96px;margin:-6px 0 0 -11px}
.lbName{flex:1;font-weight:900;font-size:22px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbPts{font-weight:900;font-size:26px;color:#ffd970;direction:ltr;display:flex;align-items:center;gap:6px}
.coin{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:15px;color:#a8691a;background:radial-gradient(circle at 35% 30%,#fff3c0,#f2c14e 55%,#b87a1a);box-shadow:0 0 0 2px #8a5410}
.lbRow.bump .lbPts{animation:bump .8s}
@keyframes bump{30%{transform:scale(1.5);color:#fff;text-shadow:0 0 20px #ffd36b}}

/* ---------- locks ---------- */
.locksGrid{position:absolute;left:470px;right:40px;top:200px;display:grid;grid-template-columns:repeat(4,1fr);gap:26px 20px;perspective:1000px}
.lock{position:relative;height:300px;cursor:pointer;transition:transform .3s,opacity .5s,filter .3s;animation:lfloat 3.5s ease-in-out infinite}
.lock:nth-child(2n){animation-delay:-1.2s}.lock:nth-child(3n){animation-delay:-2.1s}
@keyframes lfloat{50%{transform:translateY(-12px)}}
.lock:hover{transform:translateY(-18px) scale(1.06)!important;filter:brightness(1.15)}
.lock.used{filter:grayscale(.9) brightness(.45);pointer-events:none}
.lock.gone{opacity:0;transform:translateY(80px) scale(.6)!important}
.shackle{position:absolute;left:50%;top:6px;width:130px;height:140px;margin-left:-65px;border-radius:65px 65px 0 0;border:22px solid;border-bottom:0;
  border-color:#e9eef6 #8a95a8 transparent #c9d2e0;filter:drop-shadow(0 6px 6px rgba(0,0,0,.5));transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.shackle:after{content:"";position:absolute;left:-14px;top:30px;width:6px;height:80px;border-radius:4px;background:rgba(255,255,255,.7)}
.lbody{position:absolute;left:50%;top:110px;width:200px;height:170px;margin-left:-100px;border-radius:34px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--c1),var(--c2) 60%,var(--c3));
  box-shadow:inset 0 4px 0 rgba(255,255,255,.45),inset 0 -10px 18px rgba(0,0,0,.45),inset 8px 0 14px rgba(255,255,255,.12),0 0 0 4px rgba(0,0,0,.35),0 0 34px var(--c1),0 22px 30px rgba(0,0,0,.6)}
.lbody:before{content:"";position:absolute;inset:12px;border-radius:24px;border:3px solid rgba(255,255,255,.25);box-shadow:inset 0 0 0 2px rgba(0,0,0,.2)}
.riv{position:absolute;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#9aa3b5 60%,#4a5060);box-shadow:0 2px 2px rgba(0,0,0,.5)}
.emo{font-size:96px;line-height:1;filter:drop-shadow(0 6px 6px rgba(0,0,0,.5));position:relative;z-index:2}
.lbase{position:absolute;left:50%;bottom:0;width:230px;height:26px;margin-left:-115px;border-radius:50%;background:radial-gradient(ellipse,#ffe08a,#b87a1a 60%,#5a3a08);box-shadow:0 0 30px var(--c1)}
.cracks{position:absolute;left:50%;top:110px;width:200px;height:170px;margin-left:-100px;z-index:3;pointer-events:none;overflow:visible}
.cracks path{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 12px #ffd36b);stroke-dasharray:300;stroke-dashoffset:300;transition:stroke-dashoffset .35s}
.cracks path.on{stroke-dashoffset:0}
#bigLock{position:absolute;left:0;top:0;width:280px;height:300px;z-index:200;display:none;transform-origin:50% 50%}
#bigLock.open .shackle{transform:translateY(-70px) rotate(-28deg) translateX(-30px)}
#bigLock.boom .lbody,#bigLock.boom .cracks{animation:boom .6s forwards}
@keyframes boom{to{transform:scale(1.8);opacity:0;filter:brightness(3) blur(6px)}}
#bigLock.boom .shackle{animation:fly .6s forwards}
@keyframes fly{to{transform:translateY(-400px) rotate(-200deg);opacity:0}}

.card{position:absolute;left:450px;right:40px;top:96px;bottom:24px;border-radius:34px;padding:26px 40px;color:#f6f0ff;display:flex;flex-direction:column;

<script>
/* =====================================================================
   المحتوى التعليمي — مستخرج حصريًا من ملف:
   تدريبات الامتحان الفصلي – الصف الرابع – الفصل الأول 2026/2027
   (الأعداد حتى مليون، مستقيم الأعداد، العمليات الحسابية، المسائل الكلامية،
    الكسور البسيطة، الأعداد المخلوطة، الهندسة)
   ===================================================================== */
const fr=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const m=x=>`<span class="m">${x}</span>`;

const CHALLENGES=[
 {type:"اكتشف الخطأ", title:`قال سامي: «قيمة الرقم 5 في العدد ${m("305,060")} هي 500».<br>هل كلامه صحيح؟`,
  options:[`خطأ؛ الرقم 5 في منزلة الآلاف، فقيمته ${m("5,000")}`,"صحيح؛ قيمته 500",`خطأ؛ قيمته ${m("50,000")}`],answer:0,
  hint:"عُدّوا المنازل من اليمين: آحاد، عشرات، مئات، آلاف…",
  explain:`${m("305,060 = 300,000 + 5,000 + 60")}، فقيمة الرقم 5 هي ${m("5,000")}.`,
  task:`اكتبوا العدد ${m("305,060")} بالكلمات وبالصورة الموسّعة خلال 40 ثانية.`,time:40},

  options:[m("900,009"),m("90,009"),m("9,000,009")],answer:0,
  hint:"العدد المكوّن من ستة أرقام يبدأ بمنزلة مئات الآلاف.",
  explain:`${m("900,009 = 900,000 + 9")}: تسعمئة ألف وتسعة.`,
  task:"ألّفوا لغزًا مشابهًا لعدد آخر من ستة أرقام خلال 40 ثانية، ودعوا زملاءكم يحلّونه.",time:40},
 {type:"ماذا لو؟", title:`قيمة الرقم 4 في العدد ${m("347,215")} هي ${m("40,000")}.<br>ماذا يحدث لقيمته لو بدّلنا مكاني الرقمين 3 و4 فصار العدد ${m("437,215")}؟`,
  options:[`تصبح ${m("400,000")}، أي أكبر بعشر مرات`,`تبقى ${m("40,000")}`,`تصبح ${m("4,000")}`],answer:0,
  hint:"قيمة الرقم تتغيّر بتغيّر منزلته. في أيّ منزلة صار الرقم 4؟",
  explain:`في ${m("437,215")} صار الرقم 4 في منزلة مئات الآلاف، فقيمته ${m("400,000")}.`,

/* ---------- مواجهة حجر/ورقة/مقص التلقائية ---------- */
const RPS=[{e:"✊",n:"حجر"},{e:"✋",n:"ورقة"},{e:"✌️",n:"مقص"}];
const WHY={"0-2":"الحجر يكسر المقص!","2-1":"المقص يقصّ الورقة!","1-0":"الورقة تغلّف الحجر!"};
function choosePair(){
  const idx=players.map((p,i)=>i);let best=null;
  shuffle(idx);
  for(const a of idx)for(const b of idx){if(a>=b)continue;const key=a+'-'+b;const sc=players[a].duels+players[b].duels+(key===lastPair&&players.length>2?100:0);if(!best||sc<best.sc)best={a,b,sc,key}}
  lastPair=best.key;return Math.random()<.5?[best.a,best.b]:[best.b,best.a];
}
async function startDuel(){
  clearTimers();busy=true;lbShow(false);show('duel');Snd.hum(false);
  duelPair=choosePair();const [ri,li]=duelPair;
  const fR=$('fR'),fL=$('fL');
  fR.querySelector('.svgHost').innerHTML=avatarSVG(AVATARS[players[ri].av]);fL.querySelector('.svgHost').innerHTML=avatarSVG(AVATARS[players[li].av]);

  await sleep(900);
  await rpsRound();
}
async function rpsRound(){
  const [ri,li]=duelPair;
  ['hR','hL'].forEach(h=>{const e=$(h);e.className='handHex '+h.slice(1);e.style.opacity=1;e.querySelector('span').textContent='✊'});
  $('lR').textContent='';$('lL').textContent='';$('verdict').innerHTML='';$('duelVS').style.opacity=0;
  const words=['حجر…','ورقة…','مقص!'];

    const c=$('count');c.textContent=k;c.classList.remove('pop');void c.offsetWidth;c.classList.add('pop');$('chant').textContent=words[3-k];
    Snd.beep(k===1?1320:880);['hR','hL'].forEach(h=>{const e=$(h);e.classList.remove('bob');void e.offsetWidth;e.classList.add('bob')});
    cam(`translateZ(${(4-k)*70}px) rotateY(${k%2?2:-2}deg)`,.5);
    await sleep(950);
  }
  $('chant').textContent='';
  const cR=Math.floor(Math.random()*3),cL=Math.floor(Math.random()*3);
  [['hR',cR,'lR'],['hL',cL,'lL']].forEach(([h,c,l])=>{const e=$(h);e.querySelector('span').textContent=RPS[c].e;e.classList.remove('bob');e.classList.add('show');$(l).textContent=RPS[c].n});
  Snd.hit();shake();flash(.7,500);cam('translateZ(160px)',.25);
  const fx=document.createElement('div');fx.className='hitfx';$('duel').appendChild(fx);setTimeout(()=>fx.remove(),800);
  await sleep(500);cam('translateZ(60px)',.8);
  if(cR===cL){
    $('verdict').innerHTML=`<div class="v1 gt">تعادل!</div><div class="v2">${RPS[cR].n} ضد ${RPS[cL].n}… جولة إعادة حاسمة</div>`;Snd.wrong();
    await sleep(1900);return rpsRound();
  }
  const rWins=(cR-cL+3)%3===2? false : true; // see rule below
  // rock(0) beats scissors(2), scissors(2) beats paper(1), paper(1) beats rock(0)
  const beats=(a,b)=>(a===0&&b===2)||(a===2&&b===1)||(a===1&&b===0);
  const w=beats(cR,cL)?ri:li, l=w===ri?li:ri, wc=w===ri?cR:cL, lc=w===ri?cL:cR;
  // dramatic pause
  $('verdict').innerHTML=`<div class="v2" style="font-size:40px">…</div>`;Snd.tone(110,1.2,'sine',.25,0,90);
  await sleep(1300);
  winnerI=w;loserI=l;players[ri].duels++;players[li].duels++;
  const wSide=w===ri?'R':'L',lSide=wSide==='R'?'L':'R';

  $('verdict').innerHTML=`<div class="v1 gt">${esc(players[w].name)} يفوز!</div><div class="v2">${WHY[wc+'-'+lc]}</div>`;
  Snd.sting();flash(.5,700);cam(`translateZ(220px) translateX(${wSide==='R'?-260:260}px) rotateY(${wSide==='R'?-6:6}deg)`,1.2);
  await sleep(2600);
  winnerScene();
}

     <div class="powers">
       <button class="power" data-p="me">🙋 أنا أُجيب<small>+${PTS.correct}</small></button>
       <button class="power" data-p="opp">🎯 الخصم يُجيب<small>${esc(o.name)} · +${PTS.correct}</small></button>
       <button class="power" data-p="task">🎭 الخصم ينفّذ التحدي<small>تحدّي أداء · +${PTS.task}</small></button>
       <button class="power" data-p="help">🤝 أختار زميلًا يساعدني<small>+${PTS.helper}</small></button>
       <button class="power" data-p="hint">💡 أطلب تلميحًا<small>المكافأة تصبح +${PTS.hint}</small></button>
       <button class="power" data-p="mytask">🔥 أنا أنفّذ تحدّي الأداء<small>+${PTS.task}</small></button>
     </div>
   </div>`;
  card.querySelectorAll('.power').forEach(b=>b.onclick=()=>{Snd.select();power(b.dataset.p)});
}
function power(p){
  const {c}=cardState;
  if(p==='task')return taskMode(loserI,winnerI);
  if(p==='mytask')return taskMode(winnerI,loserI);
  const cfg={me:{who:winnerI,pts:PTS.correct,note:''},opp:{who:loserI,pts:PTS.correct,note:''},
    help:{who:winnerI,pts:PTS.helper,note:'🤝 يجيب بمساعدة زميل يختاره.'},hint:{who:winnerI,pts:PTS.hint,note:'',hint:true}}[p];
  answerMode(cfg.who,cfg.pts,cfg.note,cfg.hint,false);
}
function answerMode(who,pts,note,hint,steal){
  const {c}=cardState;const other=who===winnerI?loserI:winnerI;
  const idx=cardState.order||(cardState.order=shuffle(c.options.map((_,k)=>k)));
  const body=$('cbody');
  body.innerHTML=`<div class="who">${steal?'🦹 فرصة سرقة! ':''}يُجيب الآن: <b>${esc(players[who].name)}</b> — المكافأة: <b class="m">+${pts}</b></div>
   ${note?`<div class="who" style="font-size:21px;opacity:.85">${note}</div>`:''}
   ${hint?`<div class="hintBox">💡 <b>تلميح:</b> ${c.hint}</div>`:''}
   <div class="opts">${idx.map((k,n)=>`<button class="opt" data-k="${k}" ${cardState.dead&&cardState.dead.includes(k)?'disabled style="opacity:.35"':''}><b>${'أبج'[n]}</b>${c.options[k]}</button>`).join('')}</div>
   <div id="resBox"></div>`;
  body.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(b.disabled)return;const k=+b.dataset.k;body.querySelectorAll('.opt').forEach(x=>x.disabled=true);
    if(k===c.answer){b.classList.add('ok');Snd.correct();flash(.3,400);
      const rc=b.getBoundingClientRect(),sr=$('stage').getBoundingClientRect();
      award(who,pts,(rc.left-sr.left)/stageK+rc.width/stageK/2-60,(rc.top-sr.top)/stageK-40,`✅ إجابة صحيحة! ${players[who].name} +${pts}`);coins(1500);
      result(true,`✅ إجابة صحيحة! ${c.explain}`);
    }else{b.classList.add('bad');Snd.wrong();shake();
      (cardState.dead=cardState.dead||[]).push(k);
      body.querySelector(`.opt[data-k="${c.answer}"]`);
      if(!steal){
        result(false,`❌ إجابة غير صحيحة… تُفتح فرصة <b>السرقة</b> لـ ${esc(players[other].name)}!`,()=>answerMode(other,PTS.steal,'',false,true),'🦹 ابدأ فرصة السرقة');
      }else{
        body.querySelector(`.opt[data-k="${c.answer}"]`).classList.add('ok');
        result(false,`❌ لم تنجح السرقة. الإجابة الصحيحة مظلّلة بالأخضر.<br>${c.explain}`);
      }
    }
  });
}
function result(good,html,next,nextLabel){
  $('resBox').innerHTML=`<div class="res ${good?'good':'badr'}">${html}</div><div class="actions">${next?`<button class="btn blue" id="bNextA">${nextLabel}</button>`:''}<button class="btn" id="bRound">⚔ الجولة التالية</button></div>`;
  if(next)$('bNextA').onclick=()=>{Snd.click();next()};
  $('bRound').onclick=()=>{Snd.click();Snd.whoosh();startDuel()};
}
let taskTimer=null;
function taskMode(who,other){
  const {c}=cardState;const body=$('cbody');let left=c.time||30;
  body.innerHTML=`<div class="who">🎭 تحدّي أداء — يُنفّذه: <b>${esc(players[who].name)}</b> — المكافأة: <b class="m">+${PTS.task}</b></div>
   <div class="task">${c.task}</div><div class="timer" id="tmr">${left}</div>
   <div class="actions" id="tAct"><button class="btn" id="tGo">▶ ابدأ المؤقّت</button><button class="btn blue" id="tOk">✔ نُفِّذ بنجاح</button><button class="btn ghost" id="tNo">✖ لم يُنفَّذ</button></div><div id="resBox"></div>`;
  const stop=()=>{clearInterval(taskTimer);taskTimer=null};
  $('tGo').onclick=()=>{Snd.click();if(taskTimer)return;taskTimer=setInterval(()=>{left--;$('tmr').textContent=left;Snd.tick();if(left<=5&&left>0)Snd.beep(1000);if(left<=0){stop();Snd.siren(.8);$('tmr').textContent='⏰'}},1000)};
  $('tOk').onclick=()=>{stop();$('tAct').remove();Snd.correct();coins(1500);award(who,PTS.task,780,420,`🎉 ${players[who].name} نفّذ التحدّي! +${PTS.task}`);
    result(true,`🎉 أحسنتم! وللتأكّد من الفهم: ${c.explain}`)};
  $('tNo').onclick=()=>{stop();$('tAct').remove();Snd.wrong();award(other,PTS.taskSteal,780,420,`🦹 سرقة! ${players[other].name} +${PTS.taskSteal}`);
    result(false,`لم يُنفَّذ التحدّي، فذهبت نقاط السرقة إلى ${esc(players[other].name)}.<br>${c.explain}`)};
}

/* ---------- غبار ذهبي ---------- */
function dust(){const cv=$('dust'),x=cv.getContext('2d');const P=[...Array(70)].map(()=>({x:Math.random()*1600,y:Math.random()*900,r:Math.random()*2.2+.4,v:Math.random()*.35+.05,a:Math.random()*6.28}));
  (function f(){x.clearRect(0,0,1600,900);for(const p of P){p.y-=p.v;p.a+=.02;p.x+=Math.sin(p.a)*.3;if(p.y<-5){p.y=905;p.x=Math.random()*1600}
   x.fillStyle=`rgba(255,${200+Math.round(40*Math.sin(p.a))},140,${.25+.4*Math.sin(p.a*1.7)**2})`;x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill()}requestAnimationFrame(f)})()}

/* ---------- تكيّف الشاشة 16:9 ---------- */
function fit(){const w=innerWidth,h=innerHeight;stageK=Math.min(w/1600,h/900);$('stage').style.transform=`translate(${(w-1600*stageK)/2}px,${(h-900*stageK)/2}px) scale(${stageK})`}
addEventListener('resize',fit);

/* ---------- الأزرار ---------- */
const ICON_ON=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>`;
const ICON_OFF=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>`;
$('bSound').innerHTML=ICON_ON;
$('bSound').onclick=()=>{Snd.init();Snd.on=!Snd.on;$('bSound').innerHTML=Snd.on?ICON_ON:ICON_OFF;if(!Snd.on)Snd.hum(false);else Snd.click()};
$('bFull').onclick=()=>{firstGesture();Snd.click();const d=document;if(!d.fullscreenElement&&!d.webkitFullscreenElement){const e=d.documentElement;(e.requestFullscreen||e.webkitRequestFullscreen).call(e)}else{(d.exitFullscreen||d.webkitExitFullscreen).call(d)}};
$('bLB').onclick=()=>{Snd.click();if(players.length&&players[0].av>=0)lbShow($('lb').classList.contains('hide'));else toast('ستظهر لوحة المتصدرين بعد اختيار الأفاتار')};
$('bReset').onclick=()=>{Snd.init();Snd.click();resetGame()};
$('bStart').onclick=()=>{firstGesture();Snd.select();Snd.whoosh();cam('translateZ(300px)',.9);flash(.4,700);later(()=>{cam('translateZ(-60px)',.01);show('setup');renderSetup();later(()=>cam('translateZ(0)',1.2),30)},800)};
document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{Snd.click();saveNames();ptype=b.dataset.type;pnames=[];renderSetup()});
document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{Snd.click();saveNames();pcount=+b.dataset.n;renderSetup()});
$('bToAv').onclick=()=>{Snd.select();startAvatar()};
$('bToLocks').onclick=toLocks;
document.addEventListener('pointerdown',()=>{Snd.init()},{once:true});

function resetGame(){
  clearTimers();clearInterval(taskTimer);busy=false;players=[];lockMap=[];usedLocks.clear();lastPair='';
  $('lbList').innerHTML='';lbShow(false);$('siren').classList.remove('on');$('stage').classList.remove('shake','shake-long');$('bigLock').style.display='none';
  const x=$('fx').getContext('2d');x.clearRect(0,0,1600,900);
  if(Snd.on&&introPlayed){Snd.intro();Snd.hum(true)}
  intro();
}

/* ---------- تشغيل ---------- */
buildMid();$('laurelR').innerHTML=laurel();$('laurelL').innerHTML=laurel();
$('embLaurel').innerHTML=`<g transform="translate(70 120) scale(1.6)">${laurel()}</g><g transform="translate(490 120) scale(-1.6 1.6)">${laurel()}</g>`;
fit();dust();intro();
</script>
</body>
